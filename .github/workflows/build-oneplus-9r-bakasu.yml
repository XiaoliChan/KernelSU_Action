name: Build OnePlus 9R (BakaSU)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: false
        type: boolean

jobs:
  build:
    # BakaSU (main) + SUSFS via the v2 compat shim in patches/oneplus-9r/.
    uses: ./.github/workflows/build-kernel.yml
    permissions:
      contents: write
    with:
      config: config/oneplus-9r-lineage-bakasu.env
      publish_release: ${{ inputs.publish_release }}
