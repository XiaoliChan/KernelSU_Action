name: Build OnePlus 9R (KernelSU+SUSFS)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: true
        type: boolean

jobs:
  build:
    # Thin per-device wrapper around the reusable builder in build-kernel.yml.
    # KernelSU v0.9.5 + SUSFS and the oplus.config fragment live in the profile.
    uses: ./.github/workflows/build-kernel.yml
    permissions:
      # Only needed so the optional publish_release path can create a release;
      # the build job itself still runs read-only inside the called workflow.
      contents: write
    with:
      config: config/oneplus-9r-lineage-kernelsu.env
      publish_release: ${{ inputs.publish_release }}
